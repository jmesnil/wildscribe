<!DOCTYPE html>
<html>
<head>
    <style>
        body {
          margin: 0;
          display: flex;
        }

        .sidebar {
          padding: 1rem;
          box-sizing: border-box;
        }

        .sidebar a {
          text-decoration: none;
          margin: 1rem 0;
        }

        .sidebar a:hover {
          text-decoration: underline;
        }

        .content {
          flex: 1;
          padding: 2rem;
          box-sizing: border-box;
        }

            ul {
                list-style-type: none;
            }
            .nested {
                display: none;
            }
            .toggle {
                cursor: pointer;
            }
            .toggle::before {
                content: "\25BD";
                display: inline-block;
                margin-right: 5px;
            }
            .toggle.expanded::before {
                content: "\25B7";
            }
    </style>
</head>
<body>
<div class="sidebar">
    <ul>
        <li><b class="toggle"><a href="/root.html">root /</a></b>
            <ul>
                {#include sidebar-item /}
            </ul>
        </li>
    </ul>
</div>
<div id="main-content" class="content">
    {#include resource-item /}
</div>
<script>
    document.querySelectorAll('.toggle').forEach(toggler => {
        toggler.addEventListener('click', function () {
            const nextUl = this.nextElementSibling;
            if (nextUl && nextUl.tagName === 'UL') {
                nextUl.classList.toggle('nested');
                this.classList.toggle('expanded');
            }
        });
    });

    const contentEl = document.getElementById("main-content");
    function loadPage(url, push = true) {
      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error("Page not found");
          return response.text();
        })
        .then(html => {
          contentEl.innerHTML = html;
          if (push) {
            history.pushState({ url }, "", url);
          }
        })
        .catch(() => {
          contentEl.innerHTML = "<h1>404</h1><p>Page not found.</p>";
        });
    }

    document.querySelectorAll(".sidebar a").forEach(link => {
      link.addEventListener("click", (e) => {
        e.preventDefault();
        const url = e.target.getAttribute("href");
        loadPage(url);
      });
    });

    loadPage("root.html", true);
</script>
</body>
</html>
